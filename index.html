<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-900 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanPro - Controle Financeiro Inteligente & IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .glass-card { background: linear-gradient(135deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.9) 100%); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glow-emerald { box-shadow: 0 0 25px -5px rgba(16, 185, 129, 0.25); }
    </style>
</head>
<body class="h-full antialiased flex flex-col min-h-screen">

    <!-- Auth Modal -->
    <div id="authOverlay" class="fixed inset-0 z-50 bg-slate-950/95 flex items-center justify-center p-4">
        <div class="glass-card rounded-2xl shadow-2xl w-full max-w-md p-8 space-y-6">
            <h2 id="authModalTitle" class="text-xl font-bold text-white text-center">Acesse o FinanPro</h2>
            <form onsubmit="handleAuthSubmit(event)" class="space-y-4">
                <input type="email" id="authEmail" required placeholder="E-mail" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white">
                <input type="password" id="authPassword" required placeholder="Senha" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white">
                <button type="submit" id="authSubmitBtn" class="w-full py-3 bg-emerald-500 rounded-xl text-slate-950 font-bold">Entrar</button>
            </form>
            <button onclick="toggleAuthMode()" id="authToggleBtn" class="w-full text-xs text-emerald-400">Não tem conta? Cadastre-se</button>
        </div>
    </div>

    <!-- App Content -->
    <div id="appContent" class="hidden">
        <header class="p-4 bg-slate-900 border-b border-slate-800">
            <h1 class="text-xl font-bold text-white">FinanPro</h1>
        </header>
        <main class="p-6 max-w-7xl mx-auto text-center">
            <p>Bem-vindo ao FinanPro! Seu sistema está conectado ao Supabase.</p>
            <button onclick="logout()" class="mt-4 px-4 py-2 bg-rose-500 rounded-lg text-white">Sair</button>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://cnijyljechpzehemnfsl.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNuaWp5bGplY2hwemVoZW1uZnNsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1MTM4MjksImV4cCI6MjEwMTA4OTgyOX0.PNdG7UpyuVaLsRFm9Li7vvtBdfWJiP3SbRf2YmeFoDA';

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let isSignUpMode = false;

        async function handleAuthSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;

            if (isSignUpMode) {
                const { error } = await supabase.auth.signUp({ email, password });
                if (error) alert(error.message); else alert("Cadastrado! Faça login.");
            } else {
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) alert(error.message); else location.reload();
            }
        }

        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            document.getElementById('authModalTitle').textContent = isSignUpMode ? "Criar Conta" : "Acesse o FinanPro";
            document.getElementById('authSubmitBtn').textContent = isSignUpMode ? "Cadastrar" : "Entrar";
            document.getElementById('authToggleBtn').textContent = isSignUpMode ? "Já tem conta? Login" : "Não tem conta? Cadastre-se";
        }

        async function logout() { await supabase.auth.signOut(); location.reload(); }

        window.onload = async () => {
            const { data } = await supabase.auth.getSession();
            if (data.session) {
                document.getElementById('authOverlay').classList.add('hidden');
                document.getElementById('appContent').classList.remove('hidden');
            }
        };
    </script>
</body>
</html>
